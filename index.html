<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجربة تتبع اليد</title>
<style>
:root{--bg:#0B1F23;--ink:#E6F2F0;--soft:#9DBDBA;--line:#27494F;--ok:#2A9D8F;--warn:#E9A100}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0}
p{color:var(--soft);margin:4px 0 12px}
.stage{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden;border:1.5px solid var(--line)}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 22px;background:var(--ink);color:var(--bg);cursor:pointer}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.big{font-size:56px;font-weight:700;min-height:80px;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:4px 12px;border-radius:20px;border:1.5px solid var(--line);color:var(--soft)}
.chip.on{background:var(--ok);color:#fff;border-color:var(--ok)}
#st{color:var(--warn)}
</style>
</head>
<body>
<main>
<h1>تجربة تتبع اليد</h1>
<p>اضغط ابدأ، اسمح بالكاميرا، وشاور بإيدك. هتشوف النقط (21 نقطة) مرسومة على إيدك لحظيًا.</p>
<div class="stage"><video id="v" playsinline muted></video><canvas id="c"></canvas></div>
<div class="row">
 <button id="go">ابدأ الكاميرا</button>
 <label><input type="checkbox" id="sp"> انطق الرقم</label>
 <span id="st"></span>
</div>
<div class="big" id="word">-</div>
<div class="chips" id="chips"></div>
<p id="fps" style="text-align:center"></p>
</main>

<script type="module">
import {HandLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const $ = id => document.getElementById(id);
const v = $('v'), c = $('c'), ctx = c.getContext('2d');
const NAMES = ['إبهام','سبابة','وسطى','بنصر','خنصر'];
const NUMS = ['صفر','واحد','اتنين','تلاتة','أربعة','خمسة'];
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
              [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

// الشرائح الصغيرة اللي بتوري كل صباع مفتوح ولا مقفول
$('chips').innerHTML = NAMES.map((n,i)=>'<span class="chip" id="f'+i+'">'+n+'</span>').join('');

let landmarker = null;

async function loadModel(){
  $('st').textContent = 'جاري تحميل نموذج تتبع اليد...';
  const files = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await HandLandmarker.createFromOptions(files, {
    baseOptions: {modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"},
    runningMode: "VIDEO",
    numHands: 2
  });
}

// المسافة بين نقطتين
const d = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

// هل كل صباع مفتوح؟ (قاعدة بسيطة: طرف الصباع أبعد عن الرسغ من مفصله)
function fingers(lm){
  const up = [];
  up.push(d(lm[4],lm[17]) > d(lm[2],lm[17]));          // الإبهام
  [[8,6],[12,10],[16,14],[20,18]].forEach(([tip,pip])=>{
    up.push(d(lm[0],lm[tip]) > d(lm[0],lm[pip]));      // باقي الأصابع
  });
  return up;
}

function draw(lm){
  ctx.strokeStyle = '#2A9D8F'; ctx.lineWidth = 3;
  CONN.forEach(([a,b])=>{
    ctx.beginPath();
    ctx.moveTo(lm[a].x*c.width, lm[a].y*c.height);
    ctx.lineTo(lm[b].x*c.width, lm[b].y*c.height);
    ctx.stroke();
  });
  ctx.fillStyle = '#E9A100';
  lm.forEach(p=>{ctx.beginPath();ctx.arc(p.x*c.width,p.y*c.height,4,0,7);ctx.fill();});
}

let last = -1, stable = 0, shown = -1, frames = 0, t0 = performance.now();

function loop(){
  if (v.currentTime !== last){
    last = v.currentTime;
    const res = landmarker.detectForVideo(v, performance.now());
    ctx.clearRect(0,0,c.width,c.height);
    let count = -1;
    if (res.landmarks.length){
      const lm = res.landmarks[0];
      draw(lm);
      if (res.landmarks[1]) draw(res.landmarks[1]);
      const up = fingers(lm);
      up.forEach((u,i)=>$('f'+i).classList.toggle('on',u));
      count = up.filter(Boolean).length;
    } else {
      NAMES.forEach((_,i)=>$('f'+i).classList.remove('on'));
    }
    // لازم نفس الرقم يثبت 8 فريمات قبل ما نعرضه (عشان ميبقاش بيرعش)
    stable = (count === shown) ? 0 : stable + 1;
    if (stable >= 8){
      shown = count; stable = 0;
      $('word').textContent = count < 0 ? '-' : NUMS[count];
      if (count >= 0 && $('sp').checked){
        const u = new SpeechSynthesisUtterance(NUMS[count]); u.lang = 'ar-EG';
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      }
    }
    frames++;
    const now = performance.now();
    if (now - t0 > 1000){ $('fps').textContent = frames + ' فريم في الثانية'; frames = 0; t0 = now; }
  }
  requestAnimationFrame(loop);
}

$('go').onclick = async () => {
  $('go').disabled = true;
  try{
    if (!landmarker) await loadModel();
    $('st').textContent = 'جاري فتح الكاميرا...';
    v.srcObject = await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:'user', width:640, height:480}, audio:false});
    await v.play();
    c.width = v.videoWidth; c.height = v.videoHeight;
    $('st').textContent = '';
    $('go').style.display = 'none';
    loop();
  }catch(e){
    $('st').textContent = 'حصلت مشكلة: ' + (e.name === 'NotAllowedError'
      ? 'لازم تسمح للكاميرا.' : 'اتأكد من النت وجرّب تاني.');
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
